<div class="fin-field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} fin-check{% endif %}">
  {{ field.label_tag }}{{ field }}
  {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<span class="fin-field-error">{{ error }}</span>{% endfor %}
</div>
