services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: inox
      POSTGRES_USER: inox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inox -d inox"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a long random DJANGO_SECRET_KEY}
      DATABASE_URL: postgresql://inox:${POSTGRES_PASSWORD}@db:5432/inox
      DATABASE_SSLMODE: disable
      DJANGO_ALLOWED_HOSTS: ${INOX_DOMAIN:?Set your domain}
      PUBLIC_SITE_URL: https://${INOX_DOMAIN}
      TRUST_REVERSE_PROXY: "1"
      SECURITY_EMAIL_ENABLED: ${SECURITY_EMAIL_ENABLED:-0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-security.smtp_backend.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      SECURITY_OWNER_USERNAME: ${SECURITY_OWNER_USERNAME:-}
      SECURITY_PASSKEYS_ENABLED: ${SECURITY_PASSKEYS_ENABLED:-0}
      SECURITY_PASSKEY_RP_ID: ${INOX_DOMAIN}
      SECURITY_PASSKEY_ORIGIN: https://${INOX_DOMAIN}
      INOX_INVENTORY_REFRESH_ENABLED: ${INOX_INVENTORY_REFRESH_ENABLED:-0}
      INOX_INVENTORY_SHEET_ID: ${INOX_INVENTORY_SHEET_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /data/credentials/google-sheets-reader.json
      CATALOG_BACKUP_KEY: ${CATALOG_BACKUP_KEY:-}
    volumes:
      - media:/data
    expose:
      - "8000"
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      INOX_DOMAIN: ${INOX_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  database:
  media:
  certificates:
  caddy_config:
