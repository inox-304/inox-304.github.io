# This provisions only a Free web service. PostgreSQL, private object storage,
# and an HTTPS email transport must be configured before the first live deploy.
services:
  - type: web
    name: inox304-panel
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRUST_HTTPS_PROXY
        value: "1"
      - key: TRUST_REVERSE_PROXY
        value: "0"
      - key: DATABASE_SSLMODE
        value: require
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SECURITY_OWNER_USERNAME
        sync: false
      - key: SECURITY_PASSKEYS_ENABLED
        value: "0"
      - key: INOX_MEDIA_STORAGE
        value: s3
      - key: INOX_S3_BUCKET
        sync: false
      - key: INOX_S3_ENDPOINT_URL
        sync: false
      - key: INOX_S3_REGION
        sync: false
      - key: INOX_S3_ACCESS_KEY_ID
        sync: false
      - key: INOX_S3_SECRET_ACCESS_KEY
        sync: false
      - key: INOX_INVENTORY_PERSISTENCE
        value: database
      - key: SECURITY_EMAIL_ENABLED
        value: "1"
      - key: EMAIL_BACKEND
        value: security.gmail_backend.EmailBackend
      - key: GMAIL_API_CLIENT_ID
        sync: false
      - key: GMAIL_API_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
      - key: GMAIL_API_SENDER
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
